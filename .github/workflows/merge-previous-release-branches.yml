# Fork-only fixture workflow for the merge-previous-releases action.
name: Merge Previous Release Branches

permissions:
  contents: read

on:
  create:

jobs:
  merge-previous-releases:
    name: Merge previous release branches
    if: github.event.ref_type == 'branch' && startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    steps:
      - name: Merge previous releases
        uses: MetaMask/github-tools/.github/actions/merge-previous-releases@2657fe1d3a3c94ee4e56529ae64999f99830fc19
        with:
          new-release-branch: ${{ github.event.ref }}
          github-token: ${{ secrets.PR_TOKEN }}
