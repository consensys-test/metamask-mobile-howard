# Fork-only fixture workflow. Runs the candidate github-tools action on every release branch push.
name: Update Release Changelog PR

on:
  push:
    branches:
      - 'release/*'

concurrency:
  group: update-release-changelog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-branch:
    name: Validate release branch format
    runs-on: ubuntu-latest
    outputs:
      is-valid-release: ${{ steps.check.outputs.is-valid }}
    steps:
      - name: Check if branch matches release/x.y.z pattern
        id: check
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^release/[0-9]+\.[0-9]+\.[0-9]+(-ota)?$ ]]; then
            echo "is-valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "Branch '${GITHUB_REF_NAME}' is not a release branch. Skipping."
            echo "is-valid=false" >> "$GITHUB_OUTPUT"
          fi

  refresh-changelog:
    name: Update changelog
    needs: validate-branch
    if: needs.validate-branch.outputs.is-valid-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.PR_TOKEN }}
          fetch-depth: 0

      - name: Checkout github-tools
        uses: actions/checkout@v6
        with:
          repository: MetaMask/github-tools
          path: github-tools
          ref: 49a90e651395808df5ac52266f135d0c7e8644a4

      - name: Setup Node for changelog tooling
        uses: MetaMask/action-checkout-and-setup@v3
        with:
          is-high-risk-environment: true

      - name: Update Release Changelog
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.PR_TOKEN }}
          GIT_AUTHOR_NAME: metamaskbot
          GIT_AUTHOR_EMAIL: metamaskbot@users.noreply.github.com
          AI_ANALYZER_LITELLM_KEY: ${{ secrets.AI_ANALYZER_LITELLM_KEY }}
        run: |
          set -euo pipefail
          git config user.name metamaskbot
          git config user.email metamaskbot@users.noreply.github.com
          bash .github/scripts/run-update-release-changelog-mobile.sh \
            "${GITHUB_REF_NAME}" \
            mobile \
            "https://github.com/MetaMask/metamask-mobile" \
            "null"
