name: zz test team label
on:
  workflow_dispatch:
  pull_request:
    types: [reopened]
jobs:
  create-pr:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Open a PR as github-actions[bot]
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh pr create --base main --head zz-bot-pr --title 'zz bot authored PR' --body 'fork test'
  label:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Show author
        env:
          LOGIN: ${{ github.event.pull_request.user.login }}
          TYPE: ${{ github.event.pull_request.user.type }}
        run: echo "author=$LOGIN type=$TYPE"
      # The private planning repo is unreachable from a fork, so serve a fixture topology.json.
      - name: Stub topology.json lookup
        run: |
          mkdir -p "$RUNNER_TEMP/shim"
          echo '[{"githubLabel":{"name":"team-fixture"},"members":["someone-else"],"pm":"pm-user"}]' > "$RUNNER_TEMP/topology.json"
          real=$(command -v gh)
          printf '#!/bin/bash\ncase "$*" in *metamask-planning/contents/topology.json*) cat "%s/topology.json";; *) exec %s "$@";; esac\n' "$RUNNER_TEMP" "$real" > "$RUNNER_TEMP/shim/gh"
          chmod +x "$RUNNER_TEMP/shim/gh"
          echo "$RUNNER_TEMP/shim" >> "$GITHUB_PATH"
      - uses: MetaMask/github-tools/.github/actions/add-team-label@add-team-label-bot-fallback
        with:
          team-label-token: ${{ secrets.GITHUB_TOKEN }}
